name: Web Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests:
        description: "Test path or node id to run (default: the whole suite)"
        required: false
        default: "tests"

# One run at a time across the whole repo: runs share the student accounts and
# spend one-time exam attempts, so an active run is never cancelled. A newer
# run waits for it instead.
concurrency:
  group: playwright-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Headless is the default in conftest.py (HEADED is not set here).
      # pytest.ini writes reports/report.html on every run.
      # The test selection arrives as an environment variable, never pasted into
      # the script, and after "--" so pytest reads it only as a path or node id.
      # pytest still scans every argument for "-p" (plugin loading) before it
      # honours "--", so anything starting with "-" is refused outright.
      - name: Run tests
        env:
          TESTS: ${{ inputs.tests || 'tests' }}
        run: |
          case "$TESTS" in
            -*)
              echo "::error::The tests input must be a path or node id, not a pytest option."
              exit 1
              ;;
          esac
          python -m pytest --alluredir=allure-results -- "$TESTS"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/report.html
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
