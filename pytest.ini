[pytest]
# Terminal output: -v prints one line per test with its status (PASSED, FAILED,
# SKIPPED, XFAIL, XPASS, ERROR) and the run's progress percentage; -ra lists
# every test that did not pass, with its reason, in the short summary at the
# end. conftest.py adds a Failure explanations section and a Total line.
#
# HTML report (pytest-html): every run writes a single self-contained file to
# reports/report.html, overwriting the previous one. Reporting only - it changes
# nothing about which tests run or how.
#
# Allure is unaffected and stays opt-in: add --alluredir=allure-results to a
# run as before. Both reports can be produced by the same run.
addopts = -v -ra --html=reports/report.html --self-contained-html
